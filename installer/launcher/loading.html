<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'" />
  <title>DnD: The Far Realm</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      background: radial-gradient(ellipse at center, #14141f 0%, #07070b 100%);
      color: #e8e3d3; font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      overflow: hidden; user-select: none;
    }
    .title { font-size: 2.4rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: #c9a86a; text-shadow: 0 0 24px rgba(201,168,106,0.35); margin-bottom: 0.4rem; }
    .subtitle { font-size: 0.95rem; color: #8a8377; margin-bottom: 2.6rem; letter-spacing: 0.05em; }
    .ring { width: 54px; height: 54px; border: 3px solid rgba(201,168,106,0.18);
      border-top-color: #c9a86a; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { margin-top: 1.8rem; font-size: 0.9rem; color: #9c9384; max-width: 30rem;
      text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="title">The Far Realm</div>
  <div class="subtitle">Le Maître du Jeu s'éveille…</div>
  <div class="ring"></div>
  <div class="status" id="status">Démarrage du moteur local (images &amp; audio)…</div>
  <script>
    // Called by the main process to surface setup/launch warnings.
    window.__DND_SET_STATUS = function (msg) {
      var el = document.getElementById('status');
      if (el) el.textContent = msg;
    };
  </script>
</body>
</html>
