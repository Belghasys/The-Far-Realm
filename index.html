  <title>The Last Basement</title>

  <!-- Le maître du jeu parle à voix haute et entend les réponses : c'est la

  <meta name="description"
    content="Un maître du jeu qui parle à voix haute et qui vous écoute. The Last Basement est un jeu de rôle où l'IA mène la partie en direct : elle décrit, elle joue les personnages, elle entend vos réponses et se souvient de tout." />

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

  <meta property="og:title" content="The Last Basement" />
  <meta property="og:description"
    content="Un maître du jeu qui parle à voix haute et qui vous écoute. L'IA mène la partie en direct, se souvient de tout, et ne dit jamais non." />
  <meta property="og:image" content="/art/cover.webp" />
  <meta property="og:type" content="website" />

  <link

    body {
      background-color: #14023C;

    }

      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {

    ::-webkit-scrollbar-thumb {
